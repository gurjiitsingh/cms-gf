<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>{{restaurantName}} - Special Offer!</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body {
        background-color: #fef9f5;
        font-family: Arial, sans-serif;
        color: #333;
        padding: 0;
        margin: 0;
      }

      .container {
        max-width: 600px;
        margin: auto;
        background: #fff;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      }

      .header {
        text-align: center;
        background-color: #ff6b35;
        color: white;
        padding: 20px;
        border-radius: 8px 8px 0 0;
      }

      .content {
        padding: 20px 0;
        text-align: center;
      }

      .content h1 {
        font-size: 26px;
        margin-bottom: 10px;
      }

      .content p {
        font-size: 16px;
        margin-bottom: 20px;
      }

      .content img {
        max-width: 100%;
        height: auto;
        display: block;
        margin: 20px auto;
        border-radius: 6px;
      }

      .cta-button {
        display: inline-block;
        background-color: #ff6b35;
        color: white;
        text-decoration: none;
        padding: 12px 24px;
        font-size: 16px;
        border-radius: 4px;
      }

      .footer {
        font-size: 12px;
        color: #888;
        text-align: center;
        margin-top: 30px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="header">
        <h2>{{restaurantName}} Special Offer</h2>
      </div>

      <div class="content">
        <h1>{{headline}}</h1>
        <p>{{message}}</p>

        <!-- 👇 Centered Image Insert -->
        {{#if imageUrl}}
          <img src="{{imageUrl}}" alt="Special Offer Image" />
        {{/if}}

        <a href="{{ctaLink}}" class="cta-button">{{ctaText}}</a>
      </div>

      <div class="footer">
        <p>You are receiving this email because you opted in via our app or website.</p>
        <p>Unsubscribe anytime.</p>
      </div>
    </div>
  </body>
</html>
`
